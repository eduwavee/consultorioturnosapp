<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu turno</title>
<meta name="theme-color" content="#0E7C7B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(99.2% .004 190);--bg-soft:oklch(97.3% .011 190);--ink:oklch(23% .032 205);--ink-2:oklch(42% .026 205);--ink-3:oklch(57% .02 205);
  --line:oklch(91.5% .013 195);--line-2:oklch(86% .018 195);--teal:oklch(52.5% .088 192);--teal-700:oklch(43% .075 194);--teal-50:oklch(96.6% .018 188);
  --on-teal:oklch(97.5% .018 185);--danger:oklch(50% .17 27);--danger-bg:oklch(97% .02 27);--ok:oklch(52% .12 155);--ok-bg:oklch(96.5% .035 155);
  --serif:"Instrument Serif",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg-soft);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;margin-bottom:28px}
.brand b{font:400 24px var(--serif)}.brand span{font-size:13px;color:var(--ink-3)}
h1{font:400 clamp(32px,8vw,42px)/1.05 var(--serif);margin:0 0 6px;letter-spacing:-.015em}
h1 em{color:var(--teal)}
.lead{color:var(--ink-2);margin:0 0 22px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}.row span{color:var(--ink-3)}.row b{font-weight:600;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--teal-50);color:var(--teal-700)}
.chip.confirmado{background:var(--ok-bg);color:var(--ok)}.chip.cancelado,.chip.ausente{background:var(--danger-bg);color:var(--danger)}
.acciones{display:grid;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);font-weight:600;cursor:pointer;transition:border-color .25s,background-color .25s;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}.btn.primary:hover{background:var(--teal-700)}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.msg{padding:12px 14px;border-radius:12px;font-size:15px;margin-top:16px}
.msg.error{background:var(--danger-bg);color:var(--danger)}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.info{background:var(--teal-50);color:var(--teal-700)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.dia{flex:none;width:66px;padding:8px 0;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;text-align:center}
.dia small{display:block;font-size:12px;color:var(--ink-3);text-transform:capitalize}.dia b{display:block;font:400 24px/1.1 var(--serif)}
.dia[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}.dia[aria-pressed="true"] small{color:var(--on-teal)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:8px}
.slot{min-height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
h2{font:700 13px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px}
.muted{color:var(--ink-3);font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="/"><b id="marca">Consultorio</b><span id="esp"></span></a>
  <div id="cargando" class="muted">Buscando tu turno…</div>
  <div id="vista" hidden>
    <h1 id="titulo">Tu turno</h1>
    <p class="lead" id="lead"></p>
    <div class="card">
      <div class="row"><span>Estado</span><b><span class="chip" id="estado"></span></b></div>
      <div class="row"><span>Estudio</span><b id="tipo"></b></div>
      <div class="row"><span>Día</span><b id="dia"></b></div>
      <div class="row"><span>Horario</span><b id="hora"></b></div>
      <div class="row"><span>Atiende</span><b id="prof"></b></div>
    </div>
    <div class="acciones" id="acciones">
      <button class="btn primary" id="bConfirmar" type="button">Confirmo que voy</button>
      <button class="btn" id="bCambiar" type="button">Cambiar día u horario</button>
      <button class="btn danger" id="bCancelar" type="button">Cancelar el turno</button>
    </div>
    <div class="acciones" id="seguro" hidden>
      <p class="muted" style="margin:0">¿Seguro? El horario se libera para otra persona.</p>
      <button class="btn danger" id="bSiCancelar" type="button">Sí, cancelar</button>
      <button class="btn" id="bNoCancelar" type="button">No, mantener mi turno</button>
    </div>
    <section id="cambio" hidden>
      <h2>Elegí otro día</h2>
      <div class="dias" id="dias" role="group" aria-label="Día"></div>
      <div class="slots" id="slots" role="group" aria-label="Horario"></div>
      <div class="acciones">
        <button class="btn primary" id="bMover" type="button" disabled>Cambiar a este horario</button>
        <button class="btn" id="bVolver" type="button">Volver</button>
      </div>
    </section>
    <div class="msg" id="msg" role="status" hidden></div>
    <p class="muted" style="margin-top:28px" id="contacto"></p>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TZ = 'America/Argentina/Tucuman';
  const token = new URLSearchParams(location.search).get('t') || '';
  const api = (url, opts = {}) => fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts })
    .then(async r => { const b = await r.json().catch(() => ({})); if (!r.ok) throw new Error(b.error || 'No pudimos completar la acción'); return b; });
  const fDia = d => new Date(d).toLocaleDateString('es-AR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
  const fHora = d => new Date(d).toLocaleTimeString('es-AR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const ESTADOS = { reservado: 'Reservado', confirmado: 'Confirmado', cancelado: 'Cancelado', en_sala: 'En sala', atendido: 'Atendido', ausente: 'Ausente' };
  let turno = null, dias = [], diaSel = null, slotSel = null;

  function msg(texto, tipo = 'info') { const m = $('msg'); m.textContent = texto || ''; m.className = `msg ${tipo}`; m.hidden = !texto; }
  function modo(m) {
    $('acciones').hidden = m !== 'base'; $('seguro').hidden = m !== 'cancelar'; $('cambio').hidden = m !== 'cambiar';
  }

  function pintar() {
    const t = turno, activo = t.estado === 'reservado' || t.estado === 'confirmado';
    $('titulo').innerHTML = t.estado === 'cancelado' ? 'Turno <em>cancelado</em>' : t.estado === 'confirmado' ? '¡Te <em>esperamos</em>!' : `Hola, ${t.paciente.replace(/[<>&]/g, '')}`;
    $('lead').textContent = t.estado === 'cancelado' ? 'Cuando quieras, sacá otro turno desde la web.'
      : activo ? (t.gestionable ? 'Desde acá podés confirmar, cambiar o cancelar tu turno.' : 'Falta poco para tu turno: si necesitás cambiarlo, comunicate con el consultorio.') : '';
    $('estado').textContent = ESTADOS[t.estado] || t.estado; $('estado').className = `chip ${t.estado}`;
    $('tipo').textContent = t.tipo; $('dia').textContent = cap(fDia(t.inicio));
    $('hora').textContent = `${fHora(t.inicio)} a ${fHora(t.fin)} h`; $('prof').textContent = t.profesional;
    $('bConfirmar').hidden = t.estado !== 'reservado';
    modo(activo && t.gestionable ? 'base' : 'ninguno');
    if (t.estado === 'cancelado') { $('acciones').hidden = false; $('acciones').innerHTML = '<a class="btn primary" href="/#turnos">Sacar otro turno</a>'; }
  }

  async function cargar() {
    const [t, c] = await Promise.all([api(`/api/public/turnos/${encodeURIComponent(token)}`), api('/api/public/consultorio').catch(() => null)]);
    turno = t;
    if (c) {
      $('marca').textContent = c.marca; $('esp').textContent = c.especialidad; document.title = `Tu turno · ${c.nombre}`;
      $('contacto').textContent = [c.nombre, c.direccion, c.telefono].filter(Boolean).join(' · ');
    }
    $('cargando').hidden = true; $('vista').hidden = false;
    pintar();
  }

  async function accion(boton, fn, ok) {
    boton.disabled = true; msg('');
    try { await fn(); await cargar(); msg(ok, 'ok'); }
    catch (e) { msg(e.message, 'error'); }
    finally { boton.disabled = false; }
  }

  $('bConfirmar').onclick = e => accion(e.currentTarget, () => api(`/api/public/turnos/${token}/confirmar`, { method: 'POST' }), '¡Gracias! Tu turno quedó confirmado.');
  $('bCancelar').onclick = () => { msg(''); modo('cancelar'); };
  $('bNoCancelar').onclick = () => modo('base');
  $('bSiCancelar').onclick = e => accion(e.currentTarget, () => api(`/api/public/turnos/${token}/cancelar`, { method: 'POST' }), 'Listo, cancelamos tu turno.');

  /* ---------- Cambiar de horario ---------- */
  function pintarDias() {
    $('dias').innerHTML = dias.map(d => {
      const f = new Date(`${d.fecha}T12:00:00-03:00`);
      return `<button type="button" class="dia" data-f="${d.fecha}" aria-pressed="${d.fecha === diaSel}"><small>${f.toLocaleDateString('es-AR', { timeZone: TZ, weekday: 'short' }).replace('.', '')}</small><b>${f.toLocaleDateString('es-AR', { timeZone: TZ, day: 'numeric' })}</b></button>`;
    }).join('');
    const slots = dias.find(d => d.fecha === diaSel)?.slots || [];
    $('slots').innerHTML = slots.map(s => `<button type="button" class="slot" data-s="${s}" aria-pressed="${s === slotSel}">${fHora(s)}</button>`).join('');
    $('bMover').disabled = !slotSel;
  }
  $('bCambiar').onclick = async e => {
    e.currentTarget.disabled = true; msg('');
    try {
      const d = await api(`/api/public/disponibilidad?tipo=${turno.tipo_turno_id}&dias=21`);
      dias = d.dias.filter(x => x.slots.length);
      if (!dias.length) { msg('No hay otros horarios libres en las próximas tres semanas. Comunicate con el consultorio.', 'info'); return; }
      diaSel = dias[0].fecha; slotSel = null; pintarDias(); modo('cambiar');
    } catch (err) { msg(err.message, 'error'); }
    finally { e.currentTarget.disabled = false; }
  };
  $('dias').onclick = e => { const b = e.target.closest('.dia'); if (!b) return; diaSel = b.dataset.f; slotSel = null; pintarDias(); };
  $('slots').onclick = e => { const b = e.target.closest('.slot'); if (!b) return; slotSel = b.dataset.s; pintarDias(); };
  $('bVolver').onclick = () => { msg(''); modo('base'); };
  $('bMover').onclick = e => accion(e.currentTarget,
    () => api(`/api/public/turnos/${token}/reprogramar`, { method: 'POST', body: JSON.stringify({ inicio: slotSel }) }),
    'Listo, cambiamos tu turno. Te mandamos el recordatorio un día antes.');

  if (!token) { $('cargando').textContent = 'Falta el código del turno en el link. Abrilo desde el WhatsApp que te mandamos.'; return; }
  cargar().catch(e => { $('cargando').textContent = e.message; });
})();
</script>
</body>
</html>
