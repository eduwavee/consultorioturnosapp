<!doctype html>
<html lang="es-AR">
<head>

<title>Sin conexión · Consultorio</title>
<style>
:root{--bg:#F4F9F8;--ink:#14262B;--ink-3:#5B6F73;--teal:#0E7C7B}

p{color:var(--ink-3);margin:0 0 22px;max-width:34ch}

<body>
<main>
  <img src="/panel/favicon.svg" alt="">
  <h1>Sin conexión</h1>
  <p>El panel necesita internet para mostrar la agenda y las historias. Revisá la conexión y probá de nuevo.</p>
