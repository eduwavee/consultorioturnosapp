name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consultorio
          POSTGRES_PASSWORD: consultorio
          POSTGRES_DB: consultorio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U consultorio"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://consultorio:consultorio@localhost:5432/consultorio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck API
        run: npm run typecheck -w api
      - name: Build panel
        run: npm run build -w panel
      - name: Tests de integración (Postgres real)
        run: npm test
      - name: Instalar Chromium y WebKit para Playwright
        run: npx playwright install --with-deps chromium webkit
        working-directory: panel
      - name: Tests de punta a punta (landing + panel)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas
          path: panel/test-results
          retention-days: 7
