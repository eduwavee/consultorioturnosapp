# Corre el ciclo del worker (vencimientos, lista de espera y recordatorios) cada 10 minutos.
# Hace falta si el servidor está en un plan que se duerme (Render free): la llamada lo despierta.
# Configurar en el repo: Settings → Secrets → SITE_URL (https://tu-app.onrender.com) y CRON_SECRET
# (el mismo valor que la variable CRON_SECRET del servidor). Sin esos secretos, no hace nada.
name: Despertar worker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al ciclo del worker
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Sin SITE_URL o CRON_SECRET: nada que hacer"; exit 0; fi
          # El primer pedido puede tardar mientras el servidor arranca
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$SITE_URL/api/interno/ciclo"
